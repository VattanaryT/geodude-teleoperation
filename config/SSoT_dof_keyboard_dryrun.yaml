# =============================================================================
# Snapshot: keyboard dry-run + Polyscope (2026-08-13)
# =============================================================================
# Frozen copy of the free-space keyboard dry-run tuning. Do not treat this as
# the scratch file — edit SSoT_dof.yaml or SSoT_dof_spacemouse_dryrun.yaml instead.
#
# Replay:
#   geodude-ur-stringer-teleop --config config/SSoT_dof_keyboard_dryrun.yaml \
#     --backend rtde --dry-run --viz
# =============================================================================

session:
  backend: rtde
  dry_run: true

robot:
  arm: right
  ip: 192.168.1.2

paths:
  ply: data/processed/laser_profilometer/merged.ply
  T_tag0_base: null
  T_rtde_base_vention: null
  T_left_base_vention: null
  calib_meta: null
  object_offset: null
  laser_ply: null
  laser_offset: null
  log_motion: null
  record_output_dir: null

pointcloud:
  voxel_size: 0.001
  normal_orientation: 1

field:
  mode: end_lines
  flow: width
  end_line_fraction: 0.06
  swap_end_lines: false
  diffusion_scalar: 500.0

wos:
  batch_size: 32
  convergence_threshold_edge_mult: 2.0

query:
  contact_threshold_m: 0.001
  query_radius_m: 0.025
  fit_mode: sphere

vf:
  r_field_smoothing: 0.2
  relock_dist_m: 0.1
  relock_period_s: 0.01
  # Clipped to [0, 1] in code; 10.0 → snap R_motion to R_field
  motion_track: 10.0
  dry_query_period_s: 0.01

control:
  hz: 500.0
  status_hz: 1.0
  max_joint_velocity: 3.0
  rtde_accel: 1.0
  pose_gain: 4.0
  max_linear_speed: 0.05
  max_angular_speed: 0.4
  orient_lock_on_enable: true
  startup_max_joint_velocity: 0.15
  startup_rtde_accel: 0.15
  startup_max_angular_speed: 0.08
  startup_ramp_s: 1.5
  orient_lock_tol_deg: 2.0
  keyboard_step: 0.01
  spacemouse: false
  spacemouse_linear_scale: 0.05
  spacemouse_angular_scale: 0.5
  spacemouse_deadzone: 0.05
  spacemouse_hz: null
  spacemouse_axis_sign: [1, 1, 1, 1, 1, 1]
  spacemouse_path: null
  max_twist_scale: 2.0
  watchdog_ms: 500.0
  enable_key: enter
  tip_offset: [0.0, 0.0, 0.0]
  base_frame: null
  tag0_frame: null
  no_object_offset: false
  no_rtde_base_vention: false
  no_laser_offset: false
  object_offset_step_m: 0.001

viz:
  frame: vention
  frame_stride: 20
  hide_object: false
  show_object: false
  teleop_keys: false
  laser: "off"
  latency_table: false

laser:
  voxel: 0.002

tag_crosscheck:
  camera_rgb_topic: null
  camera_info_topic: null
  tag_id: 0
  tag_size_m: 0.04
  tag_family: tag36h11

record:
  mcap: false
  sample_hz: 0.0
  save_images: true
  camera_topics: null
  target_frame: vention_frame
  plot_motion: false

line_tracking:
  enabled: false
  soft_standoff: false
  standoff_distance: 0.002
  standoff_gain: 1.0
  standoff_max_speed: 0.05
  no_keyboard_normal_ff: false

tactile:
  enabled: false
  desired_normal_force: 5.0
  wrench_kp: 0.02
  wrench_ki: 0.0
  wrench_kd: 0.0
  wrench_to_vn: 0.01
  max_vn: 0.03
  ft_bias: null

in_contact:
  enabled: false
  desired_force: 5.0
  force_sign: 1.0
  force_kp: 0.001
  force_ki: 0.0
  force_kd: 0.0
  force_deadband_N: 0.35
  force_lpf_hz: 5.0
  force_contact_threshold_N: 0.6
  wrench_in_tool_frame: true
  approach_v_max: 0.006
  force_max_v: 0.010
  align_first: true
  align_enter_tol_deg: 5.0
  align_exit_tol_deg: 12.0
  align_k_perp: 100.0
  align_k_ori: 5.0
  align_m_lin: 1.0
  align_m_ang: 0.05
  align_b_lin: 45.0
  align_b_ang: 2.5
  tangent_scale: 8.0
  tangent_hold_s: 0.12
  max_linear_m_s: 0.04
  max_angular_deg_s: 12.0
  damping: 0.05
  freeze_n_on_arm: true
  bias_skip_load_N: 2.0

diag:
  hold_zero: false
  fixed_orient: false
  verify_500hz: false
  dtc_verify_seconds: 2.0
  verify_500hz_exit: false
  polyscope_version: null
