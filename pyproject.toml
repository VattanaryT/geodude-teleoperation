[project]
name = "geodude-teleoperation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gafropy",
    "numpy",
    "viser",
    "trimesh",
    "rtree",
    "pyspacemouse",
    "diffused_fields @ git+https://github.com/loewt/diffused_fields",
]

[project.optional-dependencies]
viz = [
    "gafropy[viz]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
