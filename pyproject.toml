[project]
name = "geodude-teleoperation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gafropy",
    "numpy",
    "scipy",
    "open3d",
    "viser",
    "trimesh",
    "rtree",
    "pyspacemouse",
    "pyyaml",
    "diffused_fields @ git+https://github.com/loewt/diffused_fields",
]

[project.optional-dependencies]
viz = [
    "gafropy[viz]",
]
ur = [
    "ur-rtde",
]

[project.scripts]
geodude-calibrate = "geodude_teleoperation.calibration.cli:main"
geodude-ur-stringer-teleop = "geodude_teleoperation.ur_stringer_teleop:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
