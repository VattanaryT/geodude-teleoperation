[project]
name = "geodude-teleoperation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gafropy",
    "numpy",
    "scipy",
    "viser",
    "trimesh",
    "rtree",
    "pyspacemouse",
    "pymeshlab",
]

[project.optional-dependencies]
viz = [
    "gafropy[viz]",
]
dev = [
    "pytest>=7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros -p no:launch_pytest"
pythonpath = ["src"]
testpaths = ["tests"]
