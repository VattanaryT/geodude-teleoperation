[project]
name = "geodude-teleoperation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gafropy",
    "numpy",
    "viser",
    "trimesh",
    # trimesh's ray-triangle intersector (used by mesh_fixture.scan_top_view for the
    # top-view scan) needs this for its bounding-volume tree; trimesh doesn't declare it
    # as a hard dependency itself even though intersects_location() fails without it.
    "rtree",
    "pyspacemouse",
    # NOTE: points at the local diffused_fields checkout for development (this repo and
    # diffused_fields are being developed together right now). Was previously a fork
    # (github.com/loewt/diffused_fields); swap back to a proper git/registry ref before
    # distributing this package to anyone without that checkout.
    "diffused_fields @ file:///home/tloew/coding/src/diffused_fields",
]

[project.optional-dependencies]
viz = [
    "gafropy[viz]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
